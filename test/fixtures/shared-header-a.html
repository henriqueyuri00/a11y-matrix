<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products — shared header defect</title>
<style>
  :root { --bg:#ffffff; --ink:#1a1a1a; --accent:#1c5d3f; --on-accent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161a; --ink:#e8ecef; --accent:#6cc49a; }
    /* The defect lives in the site header, so it is on every page. Reporting it
       once per page would bury the page-specific findings underneath it. */
    :root:not([data-theme=light]) .nav-cta { color: #6cc49a; }
  }
  body { background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, sans-serif; margin:0; padding:20px; }
  .nav-cta { background:var(--accent); color:var(--on-accent); border:0;
             padding:10px 16px; border-radius:8px; font-size:15px; }
</style>
</head>
<body>
  <header><nav aria-label="Main"><button class="nav-cta" type="button">Start free trial</button></nav></header>
  <main>
    <h1>Products</h1>
    <p>Everything we sell, in one place.</p>
  </main>
</body>
</html>
